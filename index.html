<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1><i class="fa-solid fa-list-check"></i> Kanban Board</h1>
      <div class="add-task-bar">
        <input type="text" id="taskInput" placeholder="Введите название новой задачи..." autocomplete="off">
        <button id="addTaskBtn"><i class="fa-solid fa-plus"></i> Добавить</button>
      </div>
    </header>

    <main class="kanban-board">
      <!-- Колонка 1 -->
      <div class="column" id="todoCol">
        <div class="column-header todo-head">
          <h3>К выполнению</h3>
          <span class="count" id="todoCount">0</span>
        </div>
        <div class="task-list" id="todoList"></div>
      </div>

      <!-- Колонка 2 -->
      <div class="column" id="progressCol">
        <div class="column-header progress-head">
          <h3>В процессе</h3>
          <span class="count" id="progressCount">0</span>
        </div>
        <div class="task-list" id="progressList"></div>
      </div>

      <!-- Колонка 3 -->
      <div class="column" id="doneCol">
        <div class="column-header done-head">
          <h3>Готово</h3>
          <span class="count" id="doneCount">0</span>
        </div>
        <div class="task-list" id="doneList"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
